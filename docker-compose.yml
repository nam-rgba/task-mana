version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raise_backend
    restart: always
    env_file:
      - ./backend/.env.production
    ports:
      - '3000:3000'
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    container_name: postgres_raise_db
    restart: always
    environment:
      POSTGRES_USER: root # user mặc định
      POSTGRES_PASSWORD: passed # password mặc định
      POSTGRES_DB: raise # tên database mặc định khi start
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
